<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg3D)"/>
  <!-- Isometric Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="100" y1="200" x2="300" y2="80"/>
    <line x1="300" y1="80" x2="500" y2="200"/>
    <line x1="500" y1="200" x2="300" y2="320"/>
    <line x1="300" y1="320" x2="100" y2="200"/>
  </g>
  <!-- 3D Isometric Cube / Case -->
  <g transform="translate(300, 190)">
    <!-- Top Face -->
    <polygon points="0,-90 120,-20 0,50 -120,-20" fill="#1e293b" stroke="#2ec4b6" stroke-width="3"/>
    <!-- Left Face -->
    <polygon points="-120,-20 0,50 0,160 -120,90" fill="#0f172a" stroke="#2ec4b6" stroke-width="3"/>
    <!-- Right Face -->
    <polygon points="0,50 120,-20 120,90 0,160" fill="#162032" stroke="#40c9ff" stroke-width="3"/>
    <!-- Mounting Holes / Details -->
    <ellipse cx="0" cy="-20" rx="35" ry="18" fill="none" stroke="#2ec4b6" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-20" r="10" fill="#2ec4b6" opacity="0.8"/>
  </g>
  <text x="300" y="365" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">Modelado y Diseño 3D - Impresión de Carcasa</text>
</svg>

