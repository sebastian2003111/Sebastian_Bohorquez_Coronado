<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgPy)"/>
  <!-- Python Code Mockup Card -->
  <rect x="50" y="40" width="220" height="300" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="50" y="40" width="220" height="30" rx="10" fill="#1e293b"/>
  <circle cx="68" cy="55" r="4" fill="#ef4444"/>
  <circle cx="82" cy="55" r="4" fill="#f59e0b"/>
  <circle cx="96" cy="55" r="4" fill="#10b981"/>
  <text x="70" y="95" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12">import turtle</text>
  <text x="70" y="120" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12">t = turtle.Turtle()</text>
  <text x="70" y="145" fill="#f43f5e" font-family="'Consolas', monospace" font-size="12">t.begin_fill()</text>
  <text x="70" y="170" fill="#a855f7" font-family="'Consolas', monospace" font-size="12">for i in range(200):</text>
  <text x="85" y="195" fill="#e2e8f0" font-family="'Consolas', monospace" font-size="12">  t.right(1)</text>
  <text x="85" y="220" fill="#e2e8f0" font-family="'Consolas', monospace" font-size="12">  t.forward(1)</text>
  <text x="70" y="245" fill="#f43f5e" font-family="'Consolas', monospace" font-size="12">t.end_fill()</text>
  <text x="70" y="280" fill="#2ec4b6" font-family="'Consolas', monospace" font-size="12"># Python Turtle 🐍</text>
  <!-- Animated Heart Graphic -->
  <g transform="translate(420, 180) scale(1.1)">
    <path d="M 0 -30 
             C -40 -90, -110 -50, -110 20 
             C -110 80, -30 130, 0 160 
             C 30 130, 110 80, 110 20 
             C 110 -50, 40 -90, 0 -30 Z" 
          fill="url(#heartGrad)" 
          stroke="#ff8da1" 
          stroke-width="3"
          filter="drop-shadow(0 0 15px rgba(255, 75, 114, 0.4))"/>
  </g>
  <text x="300" y="365" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="15" text-anchor="middle">Animaciones y Gráficos con Python Turtle</text>
</svg>

