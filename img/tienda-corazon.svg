<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowCor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgCor)"/>
  <!-- Glowing particles forming a heart -->
  <g transform="translate(300, 180) scale(1.1)">
    <!-- Heart outline particles -->
    <circle cx="0" cy="120" r="5" fill="#f43f5e" filter="drop-shadow(0 0 8px #f43f5e)"/>
    <circle cx="-30" cy="90" r="4" fill="#f43f5e"/>
    <circle cx="30" cy="90" r="4" fill="#f43f5e"/>
    <circle cx="-60" cy="50" r="5" fill="#ec4899"/>
    <circle cx="60" cy="50" r="5" fill="#ec4899"/>
    <circle cx="-85" cy="0" r="5" fill="#2ec4b6"/>
    <circle cx="85" cy="0" r="5" fill="#2ec4b6"/>
    <circle cx="-85" cy="-45" r="5" fill="#2ec4b6"/>
    <circle cx="85" cy="-45" r="5" fill="#2ec4b6"/>
    <circle cx="-55" cy="-80" r="5" fill="#38bdf8"/>
    <circle cx="55" cy="-80" r="5" fill="#38bdf8"/>
    <circle cx="-20" cy="-60" r="4" fill="#f43f5e"/>
    <circle cx="20" cy="-60" r="4" fill="#f43f5e"/>
    <circle cx="0" cy="-35" r="5" fill="#f43f5e"/>
    <!-- Inner glowing heart -->
    <path d="M 0 -20 C -25 -70 -75 -40 -75 10 C -75 50 -20 85 0 105 C 20 85 75 50 75 10 C 75 -40 25 -70 0 -20 Z" fill="url(#glowCor)" opacity="0.8" filter="drop-shadow(0 0 25px rgba(244,63,94,0.6))"/>
  </g>
  <!-- Binary / Code matrix particles -->
  <text x="100" y="100" fill="#2ec4b6" opacity="0.3" font-family="'Consolas', monospace" font-size="12">01001100</text>
  <text x="460" y="130" fill="#f43f5e" opacity="0.3" font-family="'Consolas', monospace" font-size="12">love = True</text>
  <text x="110" y="270" fill="#38bdf8" opacity="0.3" font-family="'Consolas', monospace" font-size="12">&lt;heart pulse /&gt;</text>
  <text x="440" y="280" fill="#2ec4b6" opacity="0.3" font-family="'Consolas', monospace" font-size="12">10101111</text>
  <text x="300" y="370" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Corazón de Código y Partículas Latiendo en Vivo</text>
</svg>

