<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFlor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgFlor)"/>
  <circle cx="300" cy="180" r="160" fill="url(#sunGlow)"/>
  <!-- Stems and Leaves -->
  <path d="M 270 320 Q 285 240 280 180" stroke="#16a34a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 300 320 Q 300 240 300 170" stroke="#15803d" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 330 320 Q 315 240 320 185" stroke="#16a34a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 255 250 Q 220 230 240 270 Z" fill="#22c55e"/>
  <path d="M 345 240 Q 380 220 360 260 Z" fill="#22c55e"/>
  <!-- Left Yellow Flower -->
  <g transform="translate(250, 150) scale(0.75)">
    <circle cx="0" cy="-35" r="22" fill="#facc15"/>
    <circle cx="35" cy="0" r="22" fill="#facc15"/>
    <circle cx="0" cy="35" r="22" fill="#facc15"/>
    <circle cx="-35" cy="0" r="22" fill="#facc15"/>
    <circle cx="25" cy="-25" r="22" fill="#fde047"/>
    <circle cx="-25" cy="-25" r="22" fill="#fde047"/>
    <circle cx="25" cy="25" r="22" fill="#fde047"/>
    <circle cx="-25" cy="25" r="22" fill="#fde047"/>
    <circle cx="0" cy="0" r="20" fill="#854d0e"/>
  </g>
  <!-- Right Yellow Flower -->
  <g transform="translate(350, 160) scale(0.75)">
    <circle cx="0" cy="-35" r="22" fill="#facc15"/>
    <circle cx="35" cy="0" r="22" fill="#facc15"/>
    <circle cx="0" cy="35" r="22" fill="#facc15"/>
    <circle cx="-35" cy="0" r="22" fill="#facc15"/>
    <circle cx="25" cy="-25" r="22" fill="#fde047"/>
    <circle cx="-25" cy="-25" r="22" fill="#fde047"/>
    <circle cx="25" cy="25" r="22" fill="#fde047"/>
    <circle cx="-25" cy="25" r="22" fill="#fde047"/>
    <circle cx="0" cy="0" r="20" fill="#854d0e"/>
  </g>
  <!-- Center Main Sunflower -->
  <g transform="translate(300, 130)">
    <circle cx="0" cy="-45" r="26" fill="#facc15"/>
    <circle cx="45" cy="0" r="26" fill="#facc15"/>
    <circle cx="0" cy="45" r="26" fill="#facc15"/>
    <circle cx="-45" cy="0" r="26" fill="#facc15"/>
    <circle cx="32" cy="-32" r="26" fill="#fde047"/>
    <circle cx="-32" cy="-32" r="26" fill="#fde047"/>
    <circle cx="32" cy="32" r="26" fill="#fde047"/>
    <circle cx="-32" cy="32" r="26" fill="#fde047"/>
    <circle cx="0" cy="0" r="26" fill="#713f12"/>
    <circle cx="0" cy="0" r="16" fill="#451a03"/>
  </g>
  <!-- Ribbon on Bouquet -->
  <ellipse cx="300" cy="290" rx="40" ry="14" fill="#f43f5e"/>
  <text x="300" y="370" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Flores Amarillas / Ramo Digital Animado</text>
</svg>

